openapi: 3.0.3
info:
  title: Real-Time Activity Feed API
  version: "1.0"
  description: Real-time activity feed system with REST API for event publishing and WebSocket-based live feed updates

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: auth
    description: Authentication endpoints
  - name: feed
    description: Activity feed and event publishing endpoints

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /auth/login:
    post:
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /auth/me:
    get:
      tags: [auth]
      summary: Get current user information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /feed:
    get:
      tags: [feed]
      summary: Get the activity feed with pagination, event-type filtering, and text search
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: event_type
          in: query
          schema:
            type: string
            enum: [login, upload, comment, notification, report, task, message, sync, status, approval]
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Activity feed retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FeedEvent'
                      meta:
                        $ref: '#/components/schemas/Pagination'

  /feed/event-types:
    get:
      tags: [feed]
      summary: Get the supported event types for publishing and filtering
      responses:
        '200':
          description: Event types retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
                          enum: [login, upload, comment, notification, report, task, message, sync, status, approval]

  /events:
    post:
      tags: [feed]
      summary: Publish an event
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishEventRequest'
      responses:
        '200':
          description: Event published successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FeedEvent'

  /feed/ws:
    get:
      tags: [feed]
      summary: Upgrade to a WebSocket for live activity feed updates
      responses:
        '101':
          description: WebSocket upgrade accepted. The server sends JSON messages matching the standard response envelope with a `FeedEvent` in `data`.
        '500':
          description: Live feed connection could not be established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    PublishEventRequest:
      type: object
      required: [event_type, content]
      properties:
        event_type:
          type: string
          enum: [login, upload, comment, notification, report, task, message, sync, status, approval]
          example: notification
        content:
          type: string
          example: Alice deployed version 1.2.0

    Response:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ErrorInfo'
        meta:
          type: object
          additionalProperties: true

    ErrorInfo:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    FeedEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
        event_type:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

